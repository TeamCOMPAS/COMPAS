name: COMPAS compile test

on:
  workflow_dispatch:
  pull_request:
    branches:
      - dev
    paths:
      - src/**
      - compas_python_utils/**
      - py_tests/**
      - .github/workflows/**
  push:
    branches:
      - dev

# Ensures only the latest workflow run for the same branch is active, canceling any in-progress runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compas:
    env:
      ARTIFACT_NAME: detailedEvolutionPlot.png
      ARTIFACT_PATH: py_tests/test_artifacts

    name: Build COMPAS
    runs-on: ubuntu-22.04
    # Use Docker Hub for now (GHCR is private)
    container: teamcompas/compas:latest
    # TODO: Switch to GHCR when package is made public
    # container: ghcr.io/teamcompas/compas:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build COMPAS from source
        run: |
          echo "Building COMPAS from source..."
          cd src
          make clean 2>/dev/null || echo 'No existing build to clean'
          make -j $(nproc) -f Makefile
          ./COMPAS -v
          echo "COMPAS build completed successfully!"

      - name: Install Python dependencies
        run: |
          echo "Installing Python dependencies..."
          python3 -m pip install --upgrade pip
          pip install -e .[dev]
          echo "Python dependencies installed!"

      - name: Run example COMPAS job
        run: |
          echo "Running example COMPAS job..."
          export COMPAS_EXECUTABLE_PATH=${GITHUB_WORKSPACE}/src/COMPAS
          cd ${GITHUB_WORKSPACE}/py_tests/test_data/
          chmod 755 run.sh
          echo "Contents of run.sh:"
          cat run.sh
          ./run.sh
          echo "Example job completed!"

      - name: Run pytest suite
        run: |
          echo "Running pytest suite..."
          cd ${GITHUB_WORKSPACE}
          export COMPAS_ROOT_DIR=${GITHUB_WORKSPACE}
          
          if command -v jupyter-kernelspec &> /dev/null; then
            echo "Available Jupyter kernels:"
            jupyter-kernelspec list
          fi
          
          pytest --cov=compas_python_utils/ py_tests/ -m 'not webtest'
          pytest --cov=compas_python_utils/ --cov-append py_tests/ -m webtest
          
          echo "Test artifacts:"
          ls py_tests/test_artifacts/ 2>/dev/null || echo "No test artifacts found"
          
          coverage html
          coverage-badge -o coverage_badge.svg -f
          echo "All tests completed successfully!"

      - name: Archive code coverage results
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage
          path: |
            htmlcov/
            coverage_badge.svg

      - name: Archive COMPAS detailed-evolution plot
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_PATH }}/${{ env.ARTIFACT_NAME }}
          if-no-files-found: error

      - name: Comment on PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const evolutionPlotPath = '${{ env.ARTIFACT_PATH }}/${{ env.ARTIFACT_NAME }}';
            const shortSha = context.sha.substring(0, 7);
            const workflowUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            
            let plotSection = '';
            try {
              if (fs.existsSync(evolutionPlotPath)) {
                const imageData = fs.readFileSync(evolutionPlotPath, {encoding: 'base64'});
                plotSection = `
            ### 📊 Detailed Evolution Plot
            <details><summary>Click to view evolution plot</summary>
            
            ![Evolution Plot](data:image/png;base64,${imageData})
            </details>`;
              } else {
                plotSection = '\n### ⚠️ Evolution plot not found';
              }
            } catch (error) {
              plotSection = `\n### ⚠️ Evolution plot error: ${error.message}`;
            }

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `![badge](https://img.shields.io/badge/Build_Success-28a745?style=for-the-badge&logo=github-actions&logoColor=white)

            ## ✅ COMPAS Build Successful!

            | Item | Value |
            |------|-------|
            | **Commit** | [\`${shortSha}\`](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/commit/${context.sha}) |
            | **Logs** | [View workflow](${workflowUrl}) |
            ${plotSection}
            
            ---
            <sub>Generated by COMPAS CI</sub>`
            });

      - name: Test Summary
        run: |
          echo "### COMPAS CI Results" >> $GITHUB_STEP_SUMMARY
          echo "- COMPAS Build: Success" >> $GITHUB_STEP_SUMMARY
          echo "- Python Dependencies: Success" >> $GITHUB_STEP_SUMMARY
          echo "- Example COMPAS Job: Success" >> $GITHUB_STEP_SUMMARY
          echo "- Pytest Suite: Success" >> $GITHUB_STEP_SUMMARY
          echo "- Container: teamcompas/compas:latest (Docker Hub)" >> $GITHUB_STEP_SUMMARY
          echo "- Ready to switch to: ghcr.io/teamcompas/compas:latest" >> $GITHUB_STEP_SUMMARY