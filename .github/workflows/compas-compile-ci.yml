name: COMPAS compile test

on:
  workflow_dispatch:
  pull_request:
    branches:
      - dev
    paths:
      - src/**
      - compas_python_utils/**
      - py_tests/**
      - .github/workflows/**
  push:
    branches:
      - dev

# Ensures only the latest workflow run for the same branch is active, canceling any in-progress runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compas:
    env:
      ARTIFACT_NAME: detailedEvolutionPlot.png
      ARTIFACT_PATH: py_tests/test_artifacts

    name: Build COMPAS
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Build and test COMPAS entirely in container
        run: |
          echo "Running complete COMPAS build and test suite in container..."
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            teamcompas/compas:latest \
            sh -c "
              set -e  # Exit on any error
              
              echo '=== Building COMPAS ==='
              cd src
              make clean 2>/dev/null || echo 'No existing build to clean'
              make -j \$(nproc) -f Makefile
              ./COMPAS -v
              echo 'COMPAS build successful!'
              
              echo '=== Installing Python dependencies ==='
              cd /workspace
              python3 -m pip install --upgrade pip
              pip install -e .[dev]
              echo 'Python dependencies installed!'
              
              echo '=== Running example COMPAS job ==='
              export COMPAS_EXECUTABLE_PATH=/workspace/src/COMPAS
              cd /workspace/py_tests/test_data/
              chmod 755 run.sh
              echo 'Contents of run.sh:'
              cat run.sh
              echo 'Running COMPAS example...'
              ./run.sh
              echo 'Example job completed!'
              
              echo '=== Running pytest suite ==='
              cd /workspace
              export COMPAS_ROOT_DIR=/workspace
              echo 'Available Jupyter kernels:'
              jupyter-kernelspec list || echo 'Jupyter not available, continuing...'
              
              echo 'Running non-web tests...'
              pytest --cov=compas_python_utils/ py_tests/ -m 'not webtest'
              
              echo 'Running web tests...'
              pytest --cov=compas_python_utils/ --cov-append py_tests/ -m webtest
              
              echo 'Test artifacts:'
              ls py_tests/test_artifacts || echo 'No test artifacts directory'
              
              echo 'Generating coverage reports...'
              coverage html
              coverage-badge -o coverage_badge.svg -f
              
              echo 'All tests completed successfully!'
            "

      - name: Archive code coverage results
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage
          path: |
            htmlcov/
            coverage_badge.svg

      - name: Archive COMPAS detailed-evolution plot
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_PATH }}/${{ env.ARTIFACT_NAME }}
          if-no-files-found: error

      - name: Test Summary
        run: |
          echo "### Test Results" >> $GITHUB_STEP_SUMMARY
          echo "- COMPAS Build: Success (Docker container)" >> $GITHUB_STEP_SUMMARY
          echo "- Python Utils Installation: Success (Docker container)" >> $GITHUB_STEP_SUMMARY
          echo "- Example COMPAS Job: Success (Docker container)" >> $GITHUB_STEP_SUMMARY
          echo "- Pytest Execution: Success (Docker container)" >> $GITHUB_STEP_SUMMARY
          echo "- Container used: teamcompas/compas:latest" >> $GITHUB_STEP_SUMMARY