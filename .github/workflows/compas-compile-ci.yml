name: COMPAS compile test

on:
  workflow_dispatch:
  pull_request:
    branches:
      - dev
    paths:
      - src/**
      - compas_python_utils/**
      - py_tests/**
      - .github/workflows/**
  push:
    branches:
      - dev

# Ensures only the latest workflow run for the same branch is active, canceling any in-progress runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compas:
    env:
      ARTIFACT_NAME: detailedEvolutionPlot.png
      ARTIFACT_PATH: py_tests/test_artifacts

    name: Build COMPAS
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: pip
          cache-dependency-path: setup.py

      - name: Build COMPAS using Docker container
        run: |
          echo "Building COMPAS using teamcompas/compas:latest container..."
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            teamcompas/compas:latest \
            sh -c "cd src && make clean 2>/dev/null || echo 'No existing build to clean' && make -j \$(nproc) -f Makefile && ./COMPAS -v"
          
          echo "COMPAS build completed successfully!"

      - name: Install python utils
        run: |
          pip install --upgrade pip
          pip install -e .[dev]

      - name: Run example COMPAS job
        run: |
          export COMPAS_EXECUTABLE_PATH=${{ github.workspace }}/src/COMPAS
          cd ${{ github.workspace }}/py_tests/test_data/
          chmod 755 run.sh
          echo "Contents of run.sh:"
          cat run.sh
          echo "Running COMPAS example..."
          ./run.sh

      - name: Run pytest suite
        run: |
          cd ${{ github.workspace }}
          export COMPAS_ROOT_DIR=${{ github.workspace }}
          echo "Available Jupyter kernels:"
          jupyter-kernelspec list
          echo "Running non-web tests..."
          pytest --cov=compas_python_utils/ py_tests/ -m 'not webtest'
          echo "Running web tests..."
          pytest --cov=compas_python_utils/ --cov-append py_tests/ -m webtest
          echo "Test artifacts:"
          ls py_tests/test_artifacts
          echo "Generating coverage reports..."
          coverage html
          coverage-badge -o coverage_badge.svg -f

      - name: Archive code coverage results
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage
          path: |
            htmlcov/
            coverage_badge.svg

      - name: Archive COMPAS detailed-evolution plot
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_PATH }}/${{ env.ARTIFACT_NAME }}
          if-no-files-found: error

      - name: Test Summary
        run: |
          echo "### Test Results" >> $GITHUB_STEP_SUMMARY
          echo "- COMPAS Build: Success (using Docker)" >> $GITHUB_STEP_SUMMARY
          echo "- Python Utils Installation: Success" >> $GITHUB_STEP_SUMMARY
          echo "- Example COMPAS Job: Success" >> $GITHUB_STEP_SUMMARY
          echo "- Pytest Execution: Success" >> $GITHUB_STEP_SUMMARY
          echo "- Container used: teamcompas/compas:latest" >> $GITHUB_STEP_SUMMARY