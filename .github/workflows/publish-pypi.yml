name: Publish compas-popsynth to PyPI

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Build only or publish to PyPI
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - publish

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux-wheel:
    name: Build and verify Linux wheel
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install native build dependencies
        run: |
          bash misc/cicd-scripts/linux-dependencies native-build

      - name: Build COMPAS from source
        working-directory: src
        run: |
          make DOCKER_BUILD=1 CPP="ccache g++" -j "$(nproc)" -f Makefile
          ./COMPAS -v

      - name: Package Linux bundle
        run: |
          bash misc/cicd-scripts/package-linux-bundle.sh src/COMPAS dist/COMPAS-linux-x86_64

      - name: Stage bundle into Python package tree
        run: |
          rm -rf compas_python_utils/bundled/COMPAS-linux-x86_64
          mkdir -p compas_python_utils/bundled
          cp -a dist/COMPAS-linux-x86_64 compas_python_utils/bundled/
          test -f compas_python_utils/bundled/COMPAS-linux-x86_64/run_compas.sh

      - name: Ensure wheel build tool is available
        run: |
          python -m pip install wheel auditwheel

      - name: Build Linux wheel
        env:
          COMPAS_BINARY_WHEEL: '1'
        run: |
          python setup.py bdist_wheel
          ls -1 dist/*.whl

      - name: Repair wheel for manylinux
        run: |
          mkdir -p wheelhouse
          auditwheel show dist/*.whl
          auditwheel repair --wheel-dir wheelhouse dist/*.whl
          ls -1 wheelhouse/*.whl
          ls -1 wheelhouse/*.whl | grep -q 'compas_popsynth-.*-py3-none-manylinux_.*_x86_64.whl'

      - name: Verify wheel install and smoke test
        run: |
          python -m venv wheel-venv
          . wheel-venv/bin/activate
          python -m pip install --no-deps wheelhouse/*.whl
          compas_run --print-path
          compas_run -v

          WHEEL_SMOKE_DIR="${RUNNER_TEMP}/compas-pypi-wheel-smoke"
          rm -rf "$WHEEL_SMOKE_DIR"

          compas_run \
            -n 1 \
            --initial-mass-1 35 \
            --initial-mass-2 31 \
            -a 3.5 \
            --random-seed 0 \
            --metallicity 0.001 \
            --quiet \
            -o "$WHEEL_SMOKE_DIR"

          test -d "$WHEEL_SMOKE_DIR"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: compas-popsynth-wheel
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish-pypi:
    name: Publish wheel to PyPI
    runs-on: ubuntu-22.04
    needs: build-linux-wheel
    if: ${{ github.event.inputs.mode == 'publish' }}
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: compas-popsynth-wheel
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          verbose: true
          attestations: false
